[project]
name = "pcbstitch"
version = "0.1.0"
description = "Stitch overlapping PCB scanner tiles into a seamless, evenly lit, high-resolution mosaic"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "pyvips>=2.2",
]

[project.scripts]
pcbstitch = "pcbstitch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pcbstitch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pcbstitch"]
